name: Windows Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze source
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build Windows application
        run: flutter build windows --release

      - name: Package portable build
        shell: pwsh
        run: ./tool/package_windows_release.ps1 -Version '${{ github.ref_name }}'

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Flutter System Manager ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.sha256
